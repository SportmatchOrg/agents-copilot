name: ↳ Status Report semanal

# Lógica del agente. El repo llamador solo tiene un wrapper que dice CUÁNDO
# corre (github/workflows/weekly-status.yml).
#
# Informe de avance semanal para la cátedra. Los números (tickets y SP
# completados, PRs mergeadas, arrastre) los calcula sprint.py; el modelo solo
# redacta el estado, los riesgos y la próxima semana. La tabla de métricas se
# agrega DESPUÉS del modelo, así que no la puede inventar.
#
# Dónde queda:
#   - El informe completo: en el resumen de la corrida y como artifact (90 días).
#     Arriba solo estado, veredicto y riesgos; métricas y secciones, plegadas.
#   - Discord: el titular + los riesgos + el link a la corrida, siempre (es
#     el reporte que alguien espera leer el viernes).
# Ya no se commitea a `dev`: la branch protection rechazaba el push del bot y
# el workflow fallaba casi todas las semanas.

on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del agente.
        type: string
        default: main
      linear_team_key:
        description: Key del team de Linear. Vacío = vars.LINEAR_TEAM_KEY, y si no, SPO.
        type: string
        default: ""
    secrets:
      LLM_API_KEY:
        description: API key del proveedor LLM (OpenAI-compatible; default Gemini).
        required: false
      LINEAR_API_KEY:
        description: Necesaria para el avance de tickets; sin ella el informe solo ve PRs.
        required: false
      DISCORD_WEBHOOK:
        description: Webhook de Discord donde postear el resultado.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  weekly-status:
    runs-on: ubuntu-latest

    concurrency:
      group: weekly-status-${{ github.repository }}
      cancel-in-progress: true

    env:
      AR: _agents-copilot/.github/scripts/common/agent_report.py
      SPRINT: _agents-copilot/.github/scripts/sprint/sprint.py

    steps:
      - name: Checkout de agents-copilot (lógica del agente)
        uses: actions/checkout@v4
        with:
          repository: SportmatchOrg/agents-copilot
          ref: ${{ inputs.agents_ref }}
          path: _agents-copilot
          persist-credentials: false

      - name: Datos de la semana (Linear + GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TEAM: ${{ inputs.linear_team_key || vars.LINEAR_TEAM_KEY || 'SPO' }}
        run: python3 "$SPRINT" weekly-data --team "$TEAM" --out data.json

      - name: Armar el prompt
        run: |
          {
            echo "Sos el Status Reporter de SportMatch. Con los datos de abajo, redactá el informe de avance semanal para la cátedra (Lab 4). Español, tono profesional y honesto: la cátedra valora la gestión del desvío, no el maquillaje."
            echo "Reglas: una historia está completada solo si su ticket está Done. No inventes números: las métricas ya están calculadas en 'metrics' y se agregan solas al informe; no las repitas en una tabla."
            echo "Cómo llenar el formato:"
            echo "- status (RAG): ok = el sprint en curso va en tiempo; warn = hay desvío recuperable; fail = algo comprometido no va a entrar."
            echo "- summary: el estado general en UNA oración corta (hasta 160 caracteres)."
            echo "- findings: riesgos y blockers activos, máximo 4 (urgent = compromete la entrega; important = hay que seguirlo). Arrastre incluido. ref = solo los identifiers (SPO-123)."
            echo "- sections, en este orden: 'Avance de la semana' (lo completado, con su identifier), 'Entregables / demo mostrable', 'Próxima semana'. Se muestran plegadas."
            echo ""
            python3 "$AR" contract
            echo ""
            echo "=== DATOS ==="; cat data.json
          } > prompt.txt

      - name: Llamar al modelo
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
        run: bash _agents-copilot/github/scripts/llm.sh prompt.txt > response.txt

      - name: Publicar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          FECHA=$(TZ=America/Argentina/Buenos_Aires date +%d/%m)
          python3 "$AR" from-llm --agent weekly-status --title "Status semanal · $FECHA" \
            --in response.txt --out report.json
          python3 "$SPRINT" weekly-finish --report report.json --data data.json
          python3 "$AR" render --report report.json --target summary > status-report.md
          python3 "$AR" publish --report report.json \
            --discord-policy always \
            --context "$GITHUB_REPOSITORY" \
            --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-report-${{ github.run_id }}
          path: |
            status-report.md
            data.json
          retention-days: 90
          if-no-files-found: ignore
