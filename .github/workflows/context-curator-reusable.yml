name: ↳ Curador de contexto (drift AGENTS.md)

# Lógica del agente. El repo llamador solo tiene un wrapper que dice CUÁNDO
# corre (github/workflows/context-curator.yml).
#
# Compara AGENTS.md con la realidad del repo y, si hay drift, lo deja en UN
# issue (label agente:context-curator) con el formato común
# (.github/scripts/common/agent_report.py). No auto-commitea AGENTS.md
# ("Lab4 no codifica": la decisión es humana).
#   - Issue: se abre solo si hay drift; si ya hay uno abierto, se reemplaza su
#     body (no acumula comentarios).
#   - Discord: solo cuando el estado cambia (aparece drift, o se resuelve).
#     Antes avisaba en cada push a dev/main.

on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del agente.
        type: string
        default: main
    secrets:
      LLM_API_KEY:
        description: API key del proveedor LLM (Gemini u otro OpenAI-compatible).
        required: false
      DISCORD_WEBHOOK:
        description: Webhook de Discord donde avisar.
        required: false

permissions:
  contents: read
  issues: write

jobs:
  context-curator:
    runs-on: ubuntu-latest

    concurrency:
      group: context-curator-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      AR: _agents-copilot/.github/scripts/common/agent_report.py

    steps:
      - name: Checkout del repo llamador
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Checkout de agents-copilot (lógica del agente)
        uses: actions/checkout@v4
        with:
          repository: SportmatchOrg/agents-copilot
          ref: ${{ inputs.agents_ref }}
          path: _agents-copilot
          persist-credentials: false

      - name: Recolectar realidad del repo
        run: |
          {
            echo "### Árbol (2 niveles)"; find . -maxdepth 2 -not -path '*/.git/*' -not -path './_agents-copilot*' | sort | head -100
            echo ""; echo "### Manifiestos detectados"
            for f in package.json back/package.json front/package.json requirements.txt Dockerfile docker-compose.yml; do
              [ -f "$f" ] && { echo "--- $f ---"; head -40 "$f"; }
            done
            echo ""; echo "### Últimos commits"; git log --oneline -15
          } > repo.txt
          cp AGENTS.md agents_actual.md 2>/dev/null || echo "(AGENTS.md no encontrado)" > agents_actual.md

      - name: Armar el prompt
        run: |
          {
            echo "Sos el Curador de contexto de SportMatch. Compará el AGENTS.md actual contra la realidad del repo (abajo) y detectá divergencias en: estructura de carpetas, stack tecnológico, comandos, convenciones de commits/branches, y TODOs que ya podrían completarse."
            echo "Reportá solo divergencias CONCRETAS con evidencia en la realidad del repo. Una redacción mejorable no es drift."
            echo "Cómo llenar el formato:"
            echo "- status: ok = AGENTS.md está alineado; warn = hay drift."
            echo "- summary: 'AGENTS.md alineado' o 'N divergencias' + la más importante, en una línea."
            echo "- findings: una por divergencia. important = confundiría a un dev o a un agente (estructura, stack, comandos, convenciones); minor = TODOs completables o detalles. ref = sección de AGENTS.md. detail = el cambio propuesto (proponé, no reescribas el archivo)."
            echo "- sections: []."
            echo "- Ignorá lo que esté 'Fuera de alcance' (AGENTS.md §1)."
            echo ""
            python3 "$AR" contract
            echo ""
            echo "=== AGENTS.md ACTUAL ==="; cat agents_actual.md
            echo ""
            echo "=== REALIDAD DEL REPO ==="; cat repo.txt
          } > prompt.txt

      - name: Llamar al modelo
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
        run: bash _agents-copilot/github/scripts/llm.sh prompt.txt > response.txt

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 "$AR" from-llm --agent context-curator --title "Curador de contexto · AGENTS.md" \
            --in response.txt --out report.json
          python3 "$AR" publish --report report.json \
            --issue-label "agente:context-curator" --issue-title "📄 AGENTS.md desactualizado" \
            --comment-policy not-ok-or-existing --discord-policy changed \
            --context "$GITHUB_REPOSITORY"
