name: Definition of Ready — digest semanal — reusable

# Complementa al DoD checker (que audita al FINAL de un ticket): este mira el
# backlog ANTES de que arranque el sprint y avisa qué tickets no están listos
# para tomarse (sin AC claros, sin estimar, bloqueados, sin RF asociado). Un
# ticket ambiguo que arranca mal cuesta mucho más corregirlo a mitad de sprint
# que antes de empezar. Corre lunes 09:00 ART (12:00 UTC), antes de la semana
# de trabajo. También disparable a mano. Solo lee y reporta (no mueve
# ni edita tickets — regla "Lab4 no codifica").

#
# Toda la lógica vive acá. El repo llamador solo necesita un wrapper de ~15
# líneas con el `on:` que quiera (ver github/workflows/dor-readiness.yml).

on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del agente.
        type: string
        default: main
    secrets:
      LLM_API_KEY:
        description: API key del proveedor LLM (OpenAI-compatible; default Gemini).
        required: false
      LINEAR_API_KEY:
        description: Opcional. Sin ella se omite la integración con Linear.
        required: false
      DISCORD_WEBHOOK:
        description: Webhook de Discord donde postear el resultado.
        required: false

permissions:
  contents: read

jobs:
  dor:
    runs-on: ubuntu-latest

    # A nivel job: en un reusable, un `concurrency:` de workflow hace que
    # GitHub rechace el archivo entero.
    concurrency:
      group: dor-readiness-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Checkout de agents-copilot (lógica del agente)
        uses: actions/checkout@v4
        with:
          repository: SportmatchOrg/agents-copilot
          ref: ${{ inputs.agents_ref }}
          path: _agents-copilot
          persist-credentials: false

      - name: Traer issues del backlog sin ciclo asignado
        run: |
          curl -s https://api.linear.app/graphql \
            -H "Authorization: ${LINEAR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ issues(filter:{cycle:{null:true}, state:{type:{in:[\"backlog\",\"unstarted\"]}}}, first: 25) { nodes { identifier title description estimate state{name} labels{nodes{name}} } } }"}' \
            > linear.json || echo '{"error":"linear no disponible"}' > linear.json
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

      - name: Detectar si Linear no devolvió datos
        id: linear_status
        run: |
          if jq -e '.errors, .error' linear.json >/dev/null 2>&1; then
            echo "estado=error_api" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.data.issues.nodes | length' linear.json 2>/dev/null)" = "0" ]; then
            echo "estado=sin_backlog" >> "$GITHUB_OUTPUT"
          else
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el prompt
        env:
          LINEAR_ESTADO: ${{ steps.linear_status.outputs.estado }}
        run: |
          {
            echo "Sos el agente Definition of Ready de SportMatch. Con los tickets del backlog de Linear de abajo (todavía sin ciclo asignado), evaluá cuáles NO están listos para entrar al próximo sprint."
            if [ "$LINEAR_ESTADO" != "ok" ]; then
              echo "IMPORTANTE: Linear no devolvió tickets (estado='$LINEAR_ESTADO'). No inventes un digest: decí explícitamente que no hay datos y por qué (sin backlog pendiente, o falló la API)."
            else
              echo "Por cada ticket evaluá: 1) ¿tiene criterios de aceptación claros y verificables (no solo un título vago)? 2) ¿está asociado a un RF (RF-01..RF-06)? 3) ¿tiene estimación? 4) ¿alcance acotado a un sprint, o debería partirse?"
              echo "Reportá SOLO los tickets con algún problema (no listes los que están OK, sería ruido). Agrupá por severidad: 🔴 sin AC / sin RF (bloqueante), 🟡 sin estimar o alcance dudoso."
            fi
            echo "Formato de salida (máx 15 líneas, español), listo para postear en Discord:"
            echo "📋 Definition of Ready — SportMatch — <fecha> | N tickets revisados, M con problemas | lista de tickets problemáticos con su identifier y qué falta | Si todos están OK, decilo en una línea y listo."
            echo "Es una señal para el PM antes de planning, no una crítica al equipo."
            echo ""
            echo "=== BACKLOG SIN CICLO (estado=$LINEAR_ESTADO) ==="; cat linear.json
          } > prompt.txt

      - name: Generar el digest (LLM OpenAI-compatible, default Gemini)
        id: ai
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          OUT=$(bash _agents-copilot/github/scripts/llm.sh prompt.txt)
          {
            echo 'response<<EOF_LLM'
            echo "$OUT"
            echo 'EOF_LLM'
          } >> "$GITHUB_OUTPUT"

      - name: Postear a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          resp = """${{ steps.ai.outputs.response }}"""
          if resp.startswith("LLM_UNAVAILABLE"):
              msg = f"⚠️ Definition of Ready: LLM no disponible ahora mismo, no se generó el digest de esta semana. ({resp})"
          else:
              msg = resp
          data = json.dumps({"content": msg[:1900]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (compatible; SportMatchBot/1.0)"})
          urllib.request.urlopen(req)
          PY

# Los secrets los pasa el wrapper del repo llamador; los `vars.*`
# (LLM_BASE_URL, LLM_MODEL) se resuelven contra ese repo y su organización.
