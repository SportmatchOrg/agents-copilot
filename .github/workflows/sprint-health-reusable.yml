name: ↳ Sprint Health diario

# Lógica del agente. El repo llamador solo tiene un wrapper que dice CUÁNDO
# corre (github/workflows/sprint-health.yml).
#
# Semáforo del sprint SIN modelo: los números salen de Linear y GitHub
# (.github/scripts/sprint/sprint.py). El sprint en curso son los tickets con
# el dueDate más próximo — el team no usa cycles, y por eso la versión
# anterior nunca veía datos de Linear.
#
# Discord: solo si hay algo para mirar (🟡/🔴). Un día en verde no avisa; el
# semáforo completo queda igual en el resumen de la corrida.

on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del agente.
        type: string
        default: main
      linear_team_key:
        description: Key del team de Linear. Vacío = vars.LINEAR_TEAM_KEY, y si no, SPO.
        type: string
        default: ""
    secrets:
      LLM_API_KEY:
        description: Ya no se usa (el semáforo no pasa por un modelo). Queda para no romper wrappers.
        required: false
      LINEAR_API_KEY:
        description: Sin ella el semáforo se arma solo con las PRs, y lo dice.
        required: false
      DISCORD_WEBHOOK:
        description: Webhook de Discord donde postear el resultado.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sprint-health:
    runs-on: ubuntu-latest

    # A nivel job: en un reusable, un `concurrency:` de workflow hace que
    # GitHub rechace el archivo entero.
    concurrency:
      group: sprint-health-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - name: Checkout de agents-copilot (lógica del agente)
        uses: actions/checkout@v4
        with:
          repository: SportmatchOrg/agents-copilot
          ref: ${{ inputs.agents_ref }}
          path: _agents-copilot
          persist-credentials: false

      - name: Armar el semáforo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TEAM: ${{ inputs.linear_team_key || vars.LINEAR_TEAM_KEY || 'SPO' }}
        run: python3 _agents-copilot/.github/scripts/sprint/sprint.py health --team "$TEAM" --out report.json

      - name: Publicar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 _agents-copilot/.github/scripts/common/agent_report.py publish --report report.json \
            --discord-policy not-ok \
            --context "$GITHUB_REPOSITORY" \
            --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
