name: ping (reusable)
on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del reviewer.
        type: string
        default: main
      llm_base_url:
        description: >
          Endpoint chat/completions compatible con OpenAI. Default: Gemini, el mismo
          proveedor que ya usan los otros agentes del paquete, para reutilizar
          LLM_API_KEY. Para OpenRouter:
          https://openrouter.ai/api/v1/chat/completions
        type: string
        default: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      llm_model:
        description: >
          Modelo del agente. Nunca se hardcodea en el código: cambiarlo es cambiar
          este input. Probado también con minimax/minimax-m3:free (OpenRouter).
        type: string
        default: gemini-3.6-flash
      pr_size_limit:
        description: Límite de líneas revisables por PR (QA-01).
        type: number
        default: 1000
      max_asset_bytes:
        description: Tamaño a partir del cual un asset nuevo se marca (QA-07).
        type: number
        default: 512000
    secrets:
      QA_GITHUB_TOKEN:
        description: >
          Fine-grained PAT del QA (Contents:Read, Pull requests:Read and write,
          Metadata:Read en el repo revisado; Contents:Read en agents-copilot).
          Una pending review solo la ve quien la creó: por eso tiene que ser el
          token del QA y no el GITHUB_TOKEN del bot.
        required: true
      QA_LLM_API_KEY:
        description: >
          API key del proveedor del LLM para ESTE agente. Existe aparte de
          LLM_API_KEY porque los otros agentes del paquete apuntan a Gemini y
          este a OpenRouter: si compartieran secret, la key de uno rompería al
          otro. Si no está, se usa LLM_API_KEY.
        required: false
      LLM_API_KEY:
        description: Fallback, para repos donde ya apunta al mismo proveedor.
        required: false
      LINEAR_API_KEY:
        description: Opcional. Sin ella, QA-01 (scope) y QA-05 se omiten.
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "on: block OK"
          echo "model=${{ inputs.llm_model }} limit=${{ inputs.pr_size_limit }}"
