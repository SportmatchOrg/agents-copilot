name: ↳ Traductor de PR a negocio

# Lógica del agente. El repo llamador solo tiene un wrapper que dice CUÁNDO
# corre (github/workflows/pr-business-translator.yml).
#
# Traduce el PR para alguien que no lee código: qué hace, qué riesgo tiene y
# qué probar. Publica con el formato común (.github/scripts/common/agent_report.py):
#   - PR: un comentario, editado en el lugar en cada push.
#   - Discord: una sola vez por PR, en la primera evaluación, y solo si el
#     riesgo no es bajo. El nivel de riesgo es una opinión del modelo que varía
#     entre pushes (y entre modelos del router): avisar cada cambio era ruido.
#     La versión al día está siempre en el comentario de la PR.
#   - PRs de release (head = dev): no corre. Juntan el trabajo de muchas PRs
#     que ya se tradujeron una por una.

on:
  workflow_call:
    inputs:
      agents_ref:
        description: Rama o tag de agents-copilot con la lógica del agente.
        type: string
        default: main
      skip_release_prs:
        description: No correr en las PRs cuyo head es `dev` (releases dev → main).
        type: boolean
        default: true
    secrets:
      LLM_API_KEY:
        description: API key del proveedor LLM (Gemini u otro OpenAI-compatible).
        required: false
      DISCORD_WEBHOOK:
        description: Webhook de Discord donde avisar.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-business-translator:
    runs-on: ubuntu-latest
    if: ${{ !(inputs.skip_release_prs && github.event.pull_request.head.ref == 'dev') }}

    concurrency:
      group: pr-business-translator-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      AR: _agents-copilot/.github/scripts/common/agent_report.py
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout de agents-copilot (lógica del agente)
        uses: actions/checkout@v4
        with:
          repository: SportmatchOrg/agents-copilot
          ref: ${{ inputs.agents_ref }}
          path: _agents-copilot
          persist-credentials: false

      - name: Obtener diff y título del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,headRefName > meta.json
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > diff.txt || echo "(sin diff)" > diff.txt

      - name: Armar el prompt
        run: |
          {
            echo "Sos el Traductor de PRs a Negocio de SportMatch. Traducí este PR para alguien que NO lee código (PM/PO). Español, sin jerga."
            echo "Cómo llenar el formato:"
            echo "- summary: qué hace este cambio, en 1 o 2 líneas de lenguaje de usuario."
            echo "- status según el riesgo: ok = bajo, warn = medio, fail = alto. Ojo con auth, datos personales (RNF-03), flujos Must y migraciones de base."
            echo "- findings: los motivos del riesgo, 0 a 3. Riesgo bajo => findings: []. urgent solo si el riesgo es alto."
            echo "- sections: exactamente una, {\"title\": \"Qué probar antes de aprobar\", \"open\": true, \"body\": lista numerada con los 3 checks MÁS importantes, en lenguaje de usuario}."
            echo "- No incluyas historia/RF: de la trazabilidad se encarga el DoD checker."
            echo ""
            python3 "$AR" contract
            echo ""
            echo "=== META ==="; cat meta.json
            echo ""
            echo "=== DIFF ==="; head -c 60000 diff.txt
          } > prompt.txt

      - name: Llamar al modelo
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
        run: python3 "$AR" ask --prompt prompt.txt --agent pr-business-translator --title "Resumen para negocio" --out report.json

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 "$AR" publish --report report.json --pr "$PR" \
            --discord-policy first \
            --context "PR #$PR · $PR_TITLE" --link "$PR_URL"
