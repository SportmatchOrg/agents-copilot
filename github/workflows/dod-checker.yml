name: DoD checker

# Al marcar un PR listo para revisión (o al actualizarlo), verifica la
# Definition of Done y deja el veredicto como comentario del PR + Discord.
# Si la rama referencia un ticket de Linear (convención de branch de Linear,
# ej. "santos/spm-42-login"), lo busca por su API y usa su descripción real
# como fuente de verdad de los criterios de aceptación (en vez de adivinar
# el RF desde el título), y postea el veredicto como comentario EN ESE
# TICKET. Si el PR no referencia ningún ticket, y está seteada la variable
# LINEAR_TEAM_KEY, crea un ticket nuevo señalando el problema de
# trazabilidad (AGENTS.md §8.5) en vez de solo mencionarlo en el comentario.
# Nota: en un PR abierto, "PR mergeada" y "deploy a staging" quedan como
# PENDIENTE (se confirman recién al mergear/deployar). Verifica el resto.
# Usa un LLM OpenAI-compatible (default Gemini free tier) vía la action
# compuesta .github/actions/agent-run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

concurrency:
  group: dod-checker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  dod:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_QA }}
      PR: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recolectar estado del PR (diff, checks, título)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --json title,headRefName,mergeable,state > meta.json
          gh pr checks "$PR" > checks.txt 2>/dev/null || echo "(sin checks de CI todavía)" > checks.txt
          # Los lockfiles se comen la ventana de contexto sin aportar nada al DoD:
          # se filtran para que el agente vea código, no 20k líneas de hashes.
          gh pr diff "$PR" > diff_full.txt || echo "(sin diff)" > diff_full.txt
          awk '
            /^diff --git / {
              skip = ($0 ~ /(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|poetry\.lock|Cargo\.lock|go\.sum)/)
              if (skip) print "--- (omitido del contexto: lockfile) " $0
            }
            !skip
          ' diff_full.txt > diff.txt

      - name: Buscar el ticket de Linear vinculado a la rama
        id: linear_issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
        run: |
          BRANCH=$(jq -r .headRefName meta.json)
          # Si el equipo declaró su prefijo (ej. SPM), buscamos SOLO ese patrón:
          # con el genérico, una rama "fix/2fa-login" matchea "fix-2" y el agente
          # sale a buscar un ticket que no existe.
          if [ -n "${LINEAR_TEAM_KEY:-}" ]; then
            IDENT=$(printf '%s' "$BRANCH" | grep -oiE "${LINEAR_TEAM_KEY}-[0-9]+" | head -1 | tr '[:lower:]' '[:upper:]')
          else
            IDENT=$(printf '%s' "$BRANCH" | grep -oiE '[a-z]{2,5}-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          fi
          echo "identifier=$IDENT" >> "$GITHUB_OUTPUT"
          if [ -n "$IDENT" ] && [ -n "${LINEAR_API_KEY:-}" ]; then
            bash .github/scripts/linear.sh find-by-identifier "$IDENT" > linear_issue.json 2>/dev/null
          fi
          [ -s linear_issue.json ] || echo '{}' > linear_issue.json

      - name: Armar el prompt
        run: |
          {
            echo "Sos el DoD Checker de SportMatch. Verificá la Definition of Done de este PR con la evidencia de abajo. NO cierres nada: reportás."
            echo "La Definition of Done y las convenciones del equipo son EXACTAMENTE las de la sección de AGENTS.md que va más abajo: usá esa lista, no una genérica."
            echo "Aclaraciones de evaluación: en un PR abierto, 'PR mergeada' y 'deploy a staging' se marcan ⏳ PENDIENTE (se confirman al mergear/deployar). Para 'tests verdes' usá los checks de CI. Para los criterios de aceptación (el punto clave): si hay un TICKET DE LINEAR abajo, sus campos title/description son la fuente de verdad; si viene vacío, deducí el RF del título/rama contra AGENTS.md §2 y avisá explícitamente que es una inferencia. Sumá un chequeo de deuda nueva (TODOs sin ticket, código muerto)."
            echo "Salida: tabla por criterio con ✅/❌/⏳/⚪N-A y evidencia, + veredicto final (LISTO PARA CERRAR / NO CUMPLE DoD + qué falta). Español, breve."
            echo ""
            echo "=== DEFINITION OF DONE Y CONVENCIONES (AGENTS.md) ==="
            bash .github/scripts/agents-section.sh 6
            echo ""
            echo "=== REQUERIMIENTOS FUNCIONALES (AGENTS.md) ==="
            bash .github/scripts/agents-section.sh 2
            echo ""
            echo "=== META ==="; cat meta.json
            echo ""
            echo "=== TICKET DE LINEAR VINCULADO ==="; cat linear_issue.json
            echo ""
            echo "=== CHECKS CI ==="; cat checks.txt
            echo ""
            echo "=== DIFF ==="; head -c 60000 diff.txt
          } > prompt.txt

      - name: Evaluar DoD (LLM OpenAI-compatible, default Gemini)
        id: ai
        uses: ./.github/actions/agent-run
        with:
          prompt-file: prompt.txt
          output-file: response.md
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}

      - name: Comentar el PR
        if: steps.ai.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf '### ✅ Definition of Done — chequeo automático\n\n'
            cat response.md
            printf '\n\n---\n*Chequeo asistido por IA. La decisión de cerrar es humana.*\n'
          } > body.md
          # Comentario "sticky" marcado por agente: actualiza el suyo en cada push,
          # sin spamear y sin pisar el comentario del traductor a negocio.
          bash .github/scripts/pr-comment.sh "$PR" "agente:dod-checker" body.md

      - name: Reportar en Linear (comentar el ticket real, o crear uno de seguimiento si no hay)
        if: steps.ai.outputs.available == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
          IDENT: ${{ steps.linear_issue.outputs.identifier }}
        run: |
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "Sin secret LINEAR_API_KEY, se omite la integración con Linear."
            exit 0
          fi

          ISSUE_ID=$(jq -r '.id // empty' linear_issue.json)

          if [ -n "$ISSUE_ID" ]; then
            # La rama referencia un ticket real: el veredicto queda donde el equipo ya trabaja.
            {
              printf '### ✅ DoD check automático (desde PR)\n\n'
              cat response.md
              printf '\n\nPR: %s\n' "$PR_URL"
            } > linear_comment.md
            URL=$(bash .github/scripts/linear.sh comment "$ISSUE_ID" linear_comment.md)
            [ -n "$URL" ] && echo "Comentario agregado en Linear: $URL" || echo "No se pudo comentar el ticket de Linear (revisar permisos de LINEAR_API_KEY)."
          elif [ -n "$IDENT" ]; then
            echo "La rama referencia $IDENT pero no se encontró en Linear (¿team key distinto, o el ticket no existe?). Se omite."
          elif [ -n "${LINEAR_TEAM_KEY:-}" ]; then
            # Ningún ticket vinculado: problema de trazabilidad (AGENTS.md §8.5). Se crea la tarjeta, no se inventa el AC.
            TEAM_ID=$(bash .github/scripts/linear.sh team-id "$LINEAR_TEAM_KEY")
            if [ -n "$TEAM_ID" ]; then
              TITLE=$(jq -r .title meta.json)
              {
                cat response.md
                printf '\n\nPR: %s\n\n---\n*Creado automáticamente por el DoD checker: este PR no referencia ningún ticket de Linear en el nombre de su rama (problema de trazabilidad, AGENTS.md §8.5). Verificar y asociar el RF correspondiente.*\n' "$PR_URL"
              } > linear_new_issue.md
              CREATED=$(bash .github/scripts/linear.sh create-issue "$TEAM_ID" "⚠️ PR sin ticket: $TITLE" linear_new_issue.md)
              [ -n "$CREATED" ] && echo "Ticket de seguimiento creado en Linear: $CREATED" || echo "No se pudo crear el ticket de Linear (revisar permisos de LINEAR_API_KEY)."
            else
              echo "No se pudo resolver el team de Linear con LINEAR_TEAM_KEY=$LINEAR_TEAM_KEY."
            fi
          else
            echo "PR sin ticket de Linear vinculado y sin variable LINEAR_TEAM_KEY configurada: se omite la creación automática."
          fi

      - name: Avisar por Discord
        if: always()
        env:
          REASON: ${{ steps.ai.outputs.reason }}
          AVAILABLE: ${{ steps.ai.outputs.available }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            { printf '✅ DoD check del PR %s\n\n' "$PR_URL"; cat response.md; } > msg.md
          else
            { printf '⚠️ DoD check del PR %s: LLM no disponible ahora mismo, no se evaluó DoD en este run.\n' "$PR_URL"
              printf '%s\n' "$REASON"; } > msg.md
          fi
          bash .github/scripts/notify.sh msg.md

# Secrets: LLM_API_KEY (Gemini u otro OpenAI-compatible), DISCORD_WEBHOOK_QA,
#          LINEAR_API_KEY (opcional pero recomendado: sin él se omite toda la
#          integración con Linear, el resto del chequeo funciona igual).
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh),
#          LINEAR_TEAM_KEY (ej. "SPM": habilita crear un ticket de seguimiento
#          cuando el PR no referencia ninguno, y hace más preciso el matcheo
#          del identificador en el nombre de la rama).
# Convención esperada de nombre de rama para el link automático: la que usa
# Linear al copiar "Branch name" desde un issue (ej. santos/spm-42-login).
