name: Sprint Health diario

# Semáforo diario del sprint, posteado en Discord.
# Usa un LLM OpenAI-compatible (default Gemini free tier) vía la action
# compuesta .github/actions/agent-run.
# Corre lun-vie 09:00 ART (12:00 UTC). También disparable a mano.

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sprint-health:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PROGRESS }}
    steps:
      - uses: actions/checkout@v4

      - name: Traer datos de Linear (ciclo activo)
        id: linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # linear.sh normaliza la respuesta a {status: ok|empty|error, ...}.
          # La clasificación vive en el script: la versión anterior la hacía
          # acá con `jq -e '.errors, .error'`, que toma el exit code del último
          # output y por eso reportaba un token vencido como "sin ciclo activo".
          bash .github/scripts/linear.sh active-issues > linear.json
          echo "estado=$(jq -r '.status // "error"' linear.json)" >> "$GITHUB_OUTPUT"

      - name: Traer PRs abiertos de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,title,createdAt,updatedAt,reviewDecision > prs.json || echo '[]' > prs.json

      - name: Armar el prompt
        env:
          LINEAR_ESTADO: ${{ steps.linear.outputs.estado }}
        run: |
          {
            echo "Sos el agente Sprint Health de SportMatch. Con los datos de Linear y GitHub de abajo, armá un semáforo del sprint."
            echo "Criterios de color: WIP >2 por dev = rojo; PRs sin review >48h = amarillo, >72h = rojo; tickets sin movimiento 3+ días = alerta; blockers >=2 = rojo."
            if [ "$LINEAR_ESTADO" != "ok" ]; then
              echo "IMPORTANTE: Linear no devolvió tickets del ciclo activo (status='$LINEAR_ESTADO': 'empty' = no hay ciclo/cycle activo configurado en el team, 'error' = la API falló, y el campo 'message' del JSON dice por qué). NO reportes esto como 🟢 verde ni infieras WIP/burndown de Linear — el estado de estos indicadores es DESCONOCIDO, no 'sin problemas'. Decilo explícitamente (incluí el 'message' si status='error', porque suele ser un token vencido y alguien tiene que arreglarlo) y basá el semáforo solo en los PRs de GitHub."
            fi
            echo "Formato de salida (máx 12 líneas, en español), listo para postear en Discord:"
            echo "🚦 Sprint Health — SportMatch — <fecha> | Estado 🟢/🟡/🔴/⚪(sin datos) | Burndown, WIP, Blockers, PRs esperando review, Sin movimiento, y 'Atención hoy' (máx 2 cosas)."
            echo "Es una señal, no un diagnóstico: mostrá datos, no acuses a nadie."
            echo ""
            echo "=== LINEAR (ciclo activo; status=$LINEAR_ESTADO) ==="; cat linear.json
            echo ""
            echo "=== PRs ABIERTOS ==="; cat prs.json
          } > prompt.txt

      - name: Generar resumen (LLM OpenAI-compatible, default Gemini)
        id: ai
        uses: ./.github/actions/agent-run
        with:
          prompt-file: prompt.txt
          output-file: response.md
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}

      - name: Postear a Discord
        if: always()
        env:
          AVAILABLE: ${{ steps.ai.outputs.available }}
          REASON: ${{ steps.ai.outputs.reason }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            cp response.md msg.md
          else
            { printf '⚠️ Sprint Health: LLM no disponible ahora mismo, no se generó el semáforo de hoy.\n'
              printf '%s\n' "$REASON"; } > msg.md
          fi
          bash .github/scripts/notify.sh msg.md

# Secrets necesarios: LLM_API_KEY (Gemini u otro OpenAI-compatible),
#                     LINEAR_API_KEY, DISCORD_WEBHOOK_PROGRESS
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh)
