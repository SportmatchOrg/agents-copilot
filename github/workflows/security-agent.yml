name: Security Agent

# Wrapper. Toda la lógica vive en SportmatchOrg/agents-copilot: acá solo se
# declara cuándo corre.
#
# Qué hace: levanta el back dentro del runner (base descartable, auth simulada)
# y deja UN comentario en la PR con los hallazgos de seguridad de la API.
#   - Chequeos determinísticos: en cada PR que toque back/. No gastan cuota.
#   - Loop con el modelo: solo si la PR tiene el label `security-agent`, o a
#     mano desde Actions. Gasta cuota de LLM_API_KEY.
#
# Secrets: LLM_API_KEY (solo para el loop), LLM_API_KEY_FALLBACK (opcional).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [dev, main]
    paths: ['back/**']
  workflow_dispatch:
    inputs:
      run_agent:
        description: "Correr también el loop con el modelo (gasta cuota)"
        type: boolean
        default: true

jobs:
  security-agent:
    # Van acá: un workflow llamado solo puede REDUCIR lo que el llamador le
    # pasa, nunca ampliarlo.
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    uses: SportmatchOrg/agents-copilot/.github/workflows/security-agent-reusable.yml@main
    with:
      run_agent: ${{ github.event_name == 'workflow_dispatch' && inputs.run_agent || contains(github.event.pull_request.labels.*.name, 'security-agent') }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_KEY_FALLBACK: ${{ secrets.LLM_API_KEY_FALLBACK }}
