name: Definition of Ready — digest semanal

# Complementa al DoD checker (que audita al FINAL de un ticket): este mira el
# backlog ANTES de que arranque el sprint y avisa qué tickets no están listos
# para tomarse (sin AC claros, sin estimar, bloqueados, sin RF asociado). Un
# ticket ambiguo que arranca mal cuesta mucho más corregirlo a mitad de sprint
# que antes de empezar. Corre lunes 09:00 ART (12:00 UTC), antes de la semana
# de trabajo. También disparable a mano. Solo lee y reporta (no mueve
# ni edita tickets — regla "Lab4 no codifica").

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dor:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PLANNING }}
    steps:
      - uses: actions/checkout@v4

      - name: Traer issues del backlog sin ciclo asignado
        id: linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          bash .github/scripts/linear.sh backlog-unscheduled > linear.json
          echo "estado=$(jq -r '.status // "error"' linear.json)" >> "$GITHUB_OUTPUT"

      - name: Armar el prompt
        env:
          LINEAR_ESTADO: ${{ steps.linear.outputs.estado }}
        run: |
          {
            echo "Sos el agente Definition of Ready de SportMatch. Con los tickets del backlog de Linear de abajo (todavía sin ciclo asignado), evaluá cuáles NO están listos para entrar al próximo sprint."
            if [ "$LINEAR_ESTADO" != "ok" ]; then
              echo "IMPORTANTE: Linear no devolvió tickets (status='$LINEAR_ESTADO': 'empty' = no hay backlog pendiente, 'error' = falló la API y el campo 'message' dice por qué). No inventes un digest: decí explícitamente que no hay datos y por qué."
            else
              echo "Por cada ticket evaluá: 1) ¿tiene criterios de aceptación claros y verificables (no solo un título vago)? 2) ¿está asociado a un RF de la tabla de abajo? 3) ¿tiene estimación? 4) ¿alcance acotado a un sprint, o debería partirse?"
              echo "Reportá SOLO los tickets con algún problema (no listes los que están OK, sería ruido). Agrupá por severidad: 🔴 sin AC / sin RF (bloqueante), 🟡 sin estimar o alcance dudoso."
            fi
            echo "Formato de salida (máx 15 líneas, español), listo para postear en Discord:"
            echo "📋 Definition of Ready — SportMatch — <fecha> | N tickets revisados, M con problemas | lista de tickets problemáticos con su identifier y qué falta | Si todos están OK, decilo en una línea y listo."
            echo "Es una señal para el PM antes de planning, no una crítica al equipo."
            echo ""
            echo "=== REQUERIMIENTOS FUNCIONALES (AGENTS.md) ==="
            bash .github/scripts/agents-section.sh 2
            echo ""
            echo "=== BACKLOG SIN CICLO (status=$LINEAR_ESTADO) ==="; cat linear.json
          } > prompt.txt

      - name: Generar el digest (LLM OpenAI-compatible, default Gemini)
        id: ai
        uses: ./.github/actions/agent-run
        with:
          prompt-file: prompt.txt
          output-file: response.md
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}

      - name: Postear a Discord
        if: always()
        env:
          AVAILABLE: ${{ steps.ai.outputs.available }}
          REASON: ${{ steps.ai.outputs.reason }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            cp response.md msg.md
          else
            { printf '⚠️ Definition of Ready: LLM no disponible ahora mismo, no se generó el digest de esta semana.\n'
              printf '%s\n' "$REASON"; } > msg.md
          fi
          bash .github/scripts/notify.sh msg.md

# Secrets necesarios: LLM_API_KEY (Gemini u otro OpenAI-compatible),
#                     LINEAR_API_KEY, DISCORD_WEBHOOK_PLANNING
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh)
# Asume el ciclo de vida de estados por defecto de Linear (tipos "backlog"/
# "unstarted"). Si el team renombró/reconfiguró los estados, ajustar el
# filtro state.type en el subcomando backlog-unscheduled de linear.sh.
