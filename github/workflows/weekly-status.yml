name: Status Report semanal

# Informe de avance semanal para la cátedra (Lab 4).
# Usa un LLM OpenAI-compatible (default Gemini free tier). Corre viernes 17:00 ART (20:00 UTC),
# commitea el reporte en docs/status-reports/ y postea el resumen en Discord.

on:
  schedule:
    - cron: "0 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write        # para commitear el reporte
  pull-requests: read

jobs:
  weekly-status:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PROGRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer datos de Linear (ciclo activo)
        id: linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          bash .github/scripts/linear.sh active-issues > linear.json
          echo "estado=$(jq -r '.status // "error"' linear.json)" >> "$GITHUB_OUTPUT"

      - name: Traer PRs mergeados de la semana
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state merged --limit 50 \
            --json number,title,mergedAt,url > prs.json || echo '[]' > prs.json

      - name: Armar el prompt
        env:
          LINEAR_ESTADO: ${{ steps.linear.outputs.estado }}
        run: |
          {
            echo "Sos el agente Status Reporter de SportMatch. Generá el informe de avance semanal para la cátedra (Lab 4) en Markdown, en español, con estas secciones:"
            echo "1) Estado general (RAG 🟢/🟡/🔴 + justificación), 2) Avance de la semana (historias RF-xx completadas con link al PR), 3) Entregables/demo mostrable hoy, 4) Riesgos y blockers activos, 5) Decisiones tomadas, 6) Próxima semana, 7) Métricas (velocity, PRs mergeados, carry-over)."
            echo "Regla: toda historia 'completada' debe tener su PR mergeado; si no, no está completada. Tono profesional y honesto (la cátedra valora la gestión del desvío, no el maquillaje). Respetá el alcance del MVP."
            if [ "$LINEAR_ESTADO" != "ok" ]; then
              echo "IMPORTANTE: Linear no devolvió tickets del ciclo activo (status='$LINEAR_ESTADO': 'empty' = no hay ciclo activo, 'error' = falló la API y el campo 'message' dice por qué). NO marques 'Estado general' como 🟢 por default ni completes 'Avance de la semana' con historias inventadas — decí explícitamente en el reporte que Linear no tenía ciclo activo (o falló, citando el message) y basá el reporte solo en los PRs mergeados de GitHub."
            fi
            echo ""
            echo "=== REQUERIMIENTOS FUNCIONALES (AGENTS.md) ==="
            bash .github/scripts/agents-section.sh 2
            echo ""
            echo "=== LINEAR (ciclo activo; status=$LINEAR_ESTADO) ==="; cat linear.json
            echo ""
            echo "=== PRs MERGEADOS ==="; cat prs.json
          } > prompt.txt

      - name: Generar reporte (LLM OpenAI-compatible, default Gemini)
        id: ai
        uses: ./.github/actions/agent-run
        with:
          prompt-file: prompt.txt
          output-file: response.md
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}

      - name: Guardar y commitear el reporte
        id: commit
        if: steps.ai.outputs.available == 'true'
        run: |
          mkdir -p docs/status-reports
          FECHA=$(date -u +%Y-%m-%d)
          # Se copia el archivo tal cual: antes el texto se interpolaba dentro
          # de un heredoc, así que una línea "EOF" en el reporte cortaba el
          # heredoc y el resto se ejecutaba como comandos del runner.
          cp response.md "docs/status-reports/$FECHA.md"

          git config user.name "sportmatch-bot"
          git config user.email "bot@sportmatch.local"
          git add docs/status-reports/

          if git diff --cached --quiet; then
            echo "Sin cambios respecto al último reporte, nada que commitear."
            echo "outcome=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "docs: status report semanal automático ($FECHA)"
          # A diferencia de "sin cambios", un push que falla (ej. branch protection
          # bloqueando pushes directos del bot) es un error real: no lo silenciamos,
          # porque el paso siguiente anuncia en Discord que el reporte "se guardó".
          if git push; then
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git push falló — ¿branch protection bloqueando pushes directos a $(git branch --show-current)? El reporte se generó pero NO se publicó."
            echo "outcome=push-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Postear resumen a Discord
        if: always()
        env:
          AVAILABLE: ${{ steps.ai.outputs.available }}
          REASON: ${{ steps.ai.outputs.reason }}
          OUTCOME: ${{ steps.commit.outputs.outcome }}
        run: |
          if [ "$AVAILABLE" != "true" ]; then
            { printf '⚠️ Status Report semanal: LLM no disponible ahora mismo, no se generó el reporte de esta semana.\n'
              printf '%s\n' "$REASON"; } > msg.md
          elif [ "$OUTCOME" = "push-failed" ]; then
            printf '⚠️ Status Report semanal: el reporte se generó pero el push a git falló (revisar branch protection / permisos del bot). No se publicó nada.\n' > msg.md
          elif [ "$OUTCOME" = "no-changes" ]; then
            printf 'ℹ️ Status Report semanal: el reporte generado es idéntico al anterior, no se commiteó nada.\n' > msg.md
          else
            { printf '📋 Status Report semanal — SportMatch\n\n'
              head -c 1500 response.md
              printf '\n… (reporte completo en docs/status-reports/)\n'; } > msg.md
          fi
          bash .github/scripts/notify.sh msg.md

# Secrets necesarios: LLM_API_KEY (Gemini u otro OpenAI-compatible),
#                     LINEAR_API_KEY, DISCORD_WEBHOOK_PROGRESS
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh)
