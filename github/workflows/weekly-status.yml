name: Status Report semanal

# Informe de avance semanal para la cátedra (Lab 4).
# Usa un LLM OpenAI-compatible (default Gemini free tier). Corre viernes 17:00 ART (20:00 UTC),
# commitea el reporte en docs/status-reports/ y postea el resumen en Discord.

on:
  schedule:
    - cron: "0 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write        # para commitear el reporte
  pull-requests: read

jobs:
  weekly-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer datos de Linear (ciclo activo)
        run: |
          curl -s https://api.linear.app/graphql \
            -H "Authorization: ${LINEAR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ issues(filter:{cycle:{isActive:{eq:true}}}) { nodes { identifier title state{name} estimate completedAt } } }"}' \
            > linear.json || echo '{"error":"linear no disponible"}' > linear.json
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

      - name: Detectar si Linear no devolvió datos (distinto de "todo verde")
        id: linear_status
        run: |
          if jq -e '.errors, .error' linear.json >/dev/null 2>&1; then
            echo "estado=error_api" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.data.issues.nodes | length' linear.json 2>/dev/null)" = "0" ]; then
            echo "estado=sin_ciclo_activo" >> "$GITHUB_OUTPUT"
          else
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Traer PRs mergeados de la semana
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state merged --limit 50 \
            --json number,title,mergedAt,url > prs.json || echo '[]' > prs.json

      - name: Armar el prompt
        env:
          LINEAR_ESTADO: ${{ steps.linear_status.outputs.estado }}
        run: |
          {
            echo "Sos el agente Status Reporter de SportMatch. Generá el informe de avance semanal para la cátedra (Lab 4) en Markdown, en español, con estas secciones:"
            echo "1) Estado general (RAG 🟢/🟡/🔴 + justificación), 2) Avance de la semana (historias RF-xx completadas con link al PR), 3) Entregables/demo mostrable hoy, 4) Riesgos y blockers activos, 5) Decisiones tomadas, 6) Próxima semana, 7) Métricas (velocity, PRs mergeados, carry-over)."
            echo "Regla: toda historia 'completada' debe tener su PR mergeado; si no, no está completada. Tono profesional y honesto (la cátedra valora la gestión del desvío, no el maquillaje). Respetá el alcance del MVP."
            if [ "$LINEAR_ESTADO" != "ok" ]; then
              echo "IMPORTANTE: Linear no devolvió tickets del ciclo activo (estado='$LINEAR_ESTADO'). NO marques 'Estado general' como 🟢 por default ni completes 'Avance de la semana' con historias inventadas — decí explícitamente en el reporte que Linear no tenía ciclo activo (o falló) y basá el reporte solo en los PRs mergeados de GitHub."
            fi
            echo ""
            echo "=== LINEAR (ciclo activo; estado=$LINEAR_ESTADO) ==="; cat linear.json
            echo ""
            echo "=== PRs MERGEADOS ==="; cat prs.json
          } > prompt.txt

      - name: Generar reporte (LLM OpenAI-compatible, default Gemini)
        id: ai
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          OUT=$(bash .github/scripts/llm.sh prompt.txt)
          {
            echo 'response<<EOF_LLM'
            echo "$OUT"
            echo 'EOF_LLM'
          } >> "$GITHUB_OUTPUT"

      - name: Guardar y commitear el reporte
        id: commit
        env:
          RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          if printf '%s' "$RESPONSE" | grep -q "^LLM_UNAVAILABLE"; then
            echo "LLM no disponible, no se genera el reporte: $RESPONSE"
            echo "outcome=llm-unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p docs/status-reports
          FECHA=$(date +%Y-%m-%d)
          cat > "docs/status-reports/$FECHA.md" <<'EOF'
          ${{ steps.ai.outputs.response }}
          EOF
          git config user.name "sportmatch-bot"
          git config user.email "bot@sportmatch.local"
          git add docs/status-reports/

          if git diff --cached --quiet; then
            echo "Sin cambios respecto al último reporte, nada que commitear."
            echo "outcome=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "docs: status report semanal automático ($FECHA)"
          # A diferencia de "sin cambios", un push que falla (ej. branch protection
          # bloqueando pushes directos del bot) es un error real: no lo silenciamos,
          # porque el paso siguiente anuncia en Discord que el reporte "se guardó".
          if git push; then
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git push falló — ¿branch protection bloqueando pushes directos a $(git branch --show-current)? El reporte se generó pero NO se publicó."
            echo "outcome=push-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Postear resumen a Discord
        if: steps.commit.outputs.outcome == 'pushed'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PROGRESS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          full = """${{ steps.ai.outputs.response }}"""
          resumen = "📋 Status Report semanal — SportMatch\n" + full[:1500] + "\n… (reporte completo en docs/status-reports/)"
          data = json.dumps({"content": resumen[:1900]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (compatible; SportMatchBot/1.0)"})
          urllib.request.urlopen(req)
          PY

      - name: Avisar por Discord si no se pudo publicar (LLM caído o push rechazado)
        if: always() && steps.commit.outputs.outcome == 'push-failed'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PROGRESS }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          msg = "⚠️ Status Report semanal: el reporte se generó pero el push a git falló (revisar branch protection / permisos del bot). No se publicó nada."
          data = json.dumps({"content": msg[:1900]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (compatible; SportMatchBot/1.0)"})
          urllib.request.urlopen(req)
          PY

      - name: Avisar por Discord si el LLM no estaba disponible
        if: steps.commit.outputs.outcome == 'llm-unavailable'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_PROGRESS }}
          RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          msg = f"⚠️ Status Report semanal: LLM no disponible ahora mismo, no se generó el reporte de esta semana. ({os.environ.get('RESPONSE','')})"
          data = json.dumps({"content": msg[:1900]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (compatible; SportMatchBot/1.0)"})
          urllib.request.urlopen(req)
          PY

# Secrets necesarios: LLM_API_KEY (Gemini u otro OpenAI-compatible),
#                     LINEAR_API_KEY, DISCORD_WEBHOOK_PROGRESS
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh)
