name: Traductor de PR a negocio

# Al abrir/actualizar un PR, traduce el cambio a lenguaje de negocio
# (qué historia implementa, riesgo, qué probar) y lo postea como comentario
# del PR + aviso en Discord. LLM OpenAI-compatible (default Gemini free tier).
#
# Comparte eventos con dod-checker.yml, así que cada uno marca SU comentario
# (ver .github/scripts/pr-comment.sh): antes ambos usaban `gh pr comment
# --edit-last` y, como los dos comentan como github-actions[bot], terminaban
# editando el comentario del otro.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

concurrency:
  group: pr-business-translator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_QA }}
      PR: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff y título del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --json title,body,headRefName > meta.json
          gh pr diff "$PR" > diff_full.txt || echo "(sin diff)" > diff_full.txt
          # Un lockfile puede ocupar toda la ventana de contexto y dejar al
          # agente sin ver el código real del cambio.
          awk '
            /^diff --git / {
              skip = ($0 ~ /(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|poetry\.lock|Cargo\.lock|go\.sum)/)
              if (skip) print "--- (omitido del contexto: lockfile) " $0
            }
            !skip
          ' diff_full.txt > diff.txt

      - name: Armar el prompt
        run: |
          {
            echo "Sos el Traductor de PRs a Negocio de SportMatch. Traducí este PR para alguien que NO lee código (PM/PO). Español, sin jerga."
            echo "Secciones EXACTAS: 'Qué hace este cambio' (2-3 líneas), 'Historia que implementa' (usá la tabla de RF de abajo; si no mapea a ninguno marcá ⚠️ fuera de backlog; decí si cubre todos los AC o parte), 'Riesgo' (bajo/medio/alto + por qué; ojo con auth, datos personales RNF-03 y flujos Must), 'Qué probar antes de aprobar' (checklist en lenguaje de usuario)."
            echo "Breve, cabe en un comentario."
            echo ""
            echo "=== REQUERIMIENTOS FUNCIONALES (AGENTS.md) ==="
            bash .github/scripts/agents-section.sh 2
            echo ""
            echo "=== META ==="; cat meta.json
            echo ""
            echo "=== DIFF ==="; head -c 60000 diff.txt
          } > prompt.txt

      - name: Generar traducción (LLM OpenAI-compatible, default Gemini)
        id: ai
        uses: ./.github/actions/agent-run
        with:
          prompt-file: prompt.txt
          output-file: response.md
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          model: ${{ vars.LLM_MODEL }}

      - name: Comentar el PR
        if: steps.ai.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf '### 📊 Resumen para negocio (IA)\n\n'
            cat response.md
            printf '\n\n---\n*Generado automáticamente. La decisión es humana ("Lab4 no codifica").*\n'
          } > body.md
          bash .github/scripts/pr-comment.sh "$PR" "agente:pr-business-translator" body.md

      - name: Avisar por Discord
        if: always()
        env:
          AVAILABLE: ${{ steps.ai.outputs.available }}
          REASON: ${{ steps.ai.outputs.reason }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            { printf '📊 Nuevo PR traducido a negocio: %s\n\n' "$PR_URL"; cat response.md; } > msg.md
          else
            { printf '⚠️ Traductor de PR a negocio: LLM no disponible ahora mismo, no se tradujo %s en este run.\n' "$PR_URL"
              printf '%s\n' "$REASON"; } > msg.md
          fi
          bash .github/scripts/notify.sh msg.md

# Secrets: LLM_API_KEY (Gemini u otro OpenAI-compatible), DISCORD_WEBHOOK_QA
# Variables opcionales: LLM_BASE_URL, LLM_MODEL (ver .github/scripts/llm.sh)
